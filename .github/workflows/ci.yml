name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight backend deps (pinned to match requirements.txt)
        run: |
          pip install \
            "fastapi==0.115.0" \
            "uvicorn==0.30.6" \
            "sqlalchemy==2.0.35" \
            "python-dotenv==1.0.1" \
            "python-dateutil==2.9.0.post0" \
            "python-multipart==0.0.9" \
            "rapidfuzz==3.9.7" \
            "pandas==2.2.3" \
            "openai==1.51.0" \
            "pytest==8.3.3"

      - name: Compile-check all backend modules
        run: python -m compileall -q backend/

      - name: Import-check standalone modules
        working-directory: backend
        run: |
          python -c "
          # Only import modules with no heavy transitive deps.
          # compile-check above already catches syntax errors everywhere.
          import chunking
          from database import Document
          from duplicate import compute_hash
          print('backend imports OK')
          "
        env:
          SQLITE_PATH: "/tmp/ci_test.db"

      - name: Run backend unit tests
        working-directory: backend
        run: python -m pytest tests/ -v
        env:
          SQLITE_PATH: "/tmp/ci_test.db"

  frontend:
    name: Frontend (HTML lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check index.html is well-formed
        run: |
          python3 -c "
          from html.parser import HTMLParser
          class Checker(HTMLParser):
              pass
          with open('frontend/index.html') as f:
              Checker().feed(f.read())
          print('index.html parsed OK')
          "
